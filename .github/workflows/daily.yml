name: Daily Galeri24 Scrape

on:
  schedule:
    - cron: "5 1 * * *"   # 01:05 UTC = 08:05 WIB
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_job.txt

      - name: Run daily job
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GSHEET_TAB: galeri24_harga_long
          GOOGLE_SERVICE_ACCOUNT_JSON_RAW: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_RAW }}
        run: |
          python job_daily.py
